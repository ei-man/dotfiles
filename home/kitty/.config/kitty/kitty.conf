font_family      JetBrainsMono NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Prevent display corruption with rapid terminal output (Claude Code)
sync_to_monitor no
repaint_delay 10
input_delay 3
scrollback_fill_enlarged_window no
resize_debounce_time 0.05
clipboard_control write-clipboard write-primary read-clipboard read-primary
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
# send raw Ctrl+V (0x16) so Claude Code's image paste moves here
map ctrl+shift+v send_text all \x16
map ctrl+shift+c send_key ctrl+c
map ctrl+shift+enter new_window_with_cwd
map ctrl+t new_tab_with_cwd
map ctrl+n new_os_window_with_cwd

