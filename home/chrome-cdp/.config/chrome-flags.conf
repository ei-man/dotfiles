# Read by /usr/bin/google-chrome-stable. No ~ here: the wrapper doesn't expand it.
# The profile lives outside the default dir because Chrome 136+ ignores
# --remote-debugging-port on the default dir (even via a symlink). Opened this
# way, CDP connections need no Allow dialog. See AGENTS.md "Chrome".
--user-data-dir=/home/eimas/.config/google-chrome-main
--remote-debugging-port=9222
