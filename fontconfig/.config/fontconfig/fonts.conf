<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Roboto</family> <family>Symbols Nerd Font</family> <family>Font Awesome 6 Free</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Symbols Nerd Font</family>
      <family>Font Awesome 6 Free</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono NF</family>
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>
</fontconfig>

